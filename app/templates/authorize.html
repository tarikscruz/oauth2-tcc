<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Autorizar</title>
    <style>
        body {
            font-family: Arial;
            background: #f3f4f6
        }

        main {
            max-width: 460px;
            margin: 60px auto;
            padding: 32px;
            background: white;
            border-radius: 10px
        }

        input,
        button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 6px 0 14px
        }

        .approve {
            background: #2563eb;
            color: white;
            border: 0
        }

        .deny {
            border: 0
        }

        .error {
            color: #b91c1c
        }
    </style>
</head>

<body>
    <main>
        <h1>Autorizar aplicacao</h1>
        <p><strong>{{ client_name }}</strong> solicita: <code>{{ scope }}</code></p>{% if error %}<p class="error">{{
            error }}</p>{% endif %}<form method="post"><input type="hidden" name="ticket"
                value="{{ ticket }}"><label>Usuario</label><input name="username"><label>Senha</label><input
                name="password" type="password"><button class="approve" name="decision" value="approve">Entrar e
                autorizar</button><button class="deny" name="decision" value="deny">Recusar</button></form>
    </main>
</body>

</html>
