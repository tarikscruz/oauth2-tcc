<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Cadastro</title>
    <link rel="stylesheet"
        href="data:text/css,body%7Bfont-family:Arial;background:%23f3f4f6%7Dmain%7Bmax-width:420px;margin:60px auto;padding:32px;background:white;border-radius:10px%7Dinput,button%7Bbox-sizing:border-box;width:100%25;padding:12px;margin:6px 0 16px%7Dbutton%7Bbackground:%232563eb;color:white;border:0%7D.error%7Bcolor:%23b91c1c%7D">
</head>

<body>
    <main>
        <h1>Criar usuario</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">
            <label>Usuario</label><input name="username" required><label>Senha</label><input name="password"
                type="password" minlength="12" required><button>Cadastrar</button></form>
    </main>
</body>

</html>
